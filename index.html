<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Votre produit</title>
<style>
  :root {
    --bg: #0b0b0d;
    --card: #17171a;
    --text: #f5f5f5;
    --muted: #9a9a9a;
    --accent: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 32px;
    max-width: 420px;
    width: 100%;
  }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p.desc { color: var(--muted); margin: 0 0 24px; }
  .price { font-size: 2.4rem; font-weight: 700; margin-bottom: 24px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #0e0e10;
    color: var(--text);
    margin-bottom: 20px;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #000;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .err { color: #ff6b6b; font-size: 0.85rem; margin-top: 10px; display: none; }
</style>
</head>
<body>

<div class="card">
  <h1>Nom de votre produit</h1>
  <p class="desc">Description courte de ce que vous vendez.</p>
  <div class="price">€300</div>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="vous@exemple.com" required />

  <button id="pay-btn">Payer maintenant</button>
  <p class="err" id="err">Une erreur est survenue, réessayez.</p>
</div>

<script type="module">
  import { PolarEmbedCheckout } from "https://cdn.jsdelivr.net/npm/@polar-sh/checkout/dist/embed.js";

  const btn = document.getElementById("pay-btn");
  const emailInput = document.getElementById("email");
  const errEl = document.getElementById("err");

  btn.addEventListener("click", async () => {
    errEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Chargement...";

    try {
      // On ne fait qu'appeler NOTRE backend, jamais l'API Polar directement
      // depuis le navigateur (le token reste côté serveur).
      const res = await fetch("/api/checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: emailInput.value || undefined }),
      });
      if (!res.ok) throw new Error("checkout_failed");
      const { url } = await res.json();

      // Ouvre le paiement Polar dans une iframe embarquée sur CETTE page,
      // avec le pays déjà fixé sur Burkina Faso et sans case "entreprise"
      // à cocher (ces choix ont été faits côté backend).
      await PolarEmbedCheckout.create(url, { theme: "dark" });
    } catch (e) {
      errEl.style.display = "block";
    } finally {
      btn.disabled = false;
      btn.textContent = "Payer maintenant";
    }
  });
</script>

</body>
</html>
