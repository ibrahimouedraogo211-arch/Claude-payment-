<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boutique</title>
<style>
  :root {
    --bg: #0b0b0d;
    --card: #17171a;
    --text: #f5f5f5;
    --muted: #9a9a9a;
    --accent: #ffffff;
    --skeleton: #232326;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 32px;
    max-width: 420px;
    width: 100%;
  }
  .store { color: var(--muted); font-size: 0.85rem; margin: 0 0 6px; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p.desc { color: var(--muted); margin: 0 0 24px; white-space: pre-wrap; }
  .price { font-size: 2.4rem; font-weight: 700; margin-bottom: 24px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #0e0e10;
    color: var(--text);
    margin-bottom: 20px;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #000;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .err {
    color: #ff6b6b;
    font-size: 0.85rem;
    margin-top: 12px;
    display: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .skeleton {
    background: var(--skeleton);
    border-radius: 6px;
    color: transparent !important;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>

<div class="card">
  <p class="store skeleton" id="store-name">Boutique</p>
  <h1 class="skeleton" id="product-name">Nom du produit</h1>
  <p class="desc skeleton" id="product-desc">Description du produit en cours de chargement…</p>
  <div class="price skeleton" id="product-price">€0</div>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="vous@exemple.com" required />

  <button id="pay-btn" disabled>Chargement du produit...</button>
  <p class="err" id="err"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@polar-sh/checkout@latest/dist/embed.global.js"></script>

<script>
  const btn = document.getElementById("pay-btn");
  const emailInput = document.getElementById("email");
  const errEl = document.getElementById("err");
  const storeNameEl = document.getElementById("store-name");
  const productNameEl = document.getElementById("product-name");
  const productDescEl = document.getElementById("product-desc");
  const productPriceEl = document.getElementById("product-price");

  function showError(message) {
    errEl.textContent = message;
    errEl.style.display = "block";
    console.error(message);
  }

  function formatPrice(price) {
    if (!price) return "";
    if (price.type === "free") return "Gratuit";
    if (price.type !== "fixed") return "";
    const amount = price.amount / 100;
    try {
      return new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: price.currency.toUpperCase(),
      }).format(amount);
    } catch {
      return amount.toFixed(2) + " " + price.currency.toUpperCase();
    }
  }

  async function loadProduct() {
    try {
      const res = await fetch("/api/product");
      const data = await res.json();
      if (!res.ok) throw new Error((data.error || "Impossible de charger le produit") + (data.detail ? " — " + data.detail : ""));

      storeNameEl.textContent = data.storeName || "";
      storeNameEl.classList.remove("skeleton");
      if (!data.storeName) storeNameEl.style.display = "none";

      productNameEl.textContent = data.name || "Produit";
      productNameEl.classList.remove("skeleton");

      productDescEl.textContent = data.description || "";
      productDescEl.classList.remove("skeleton");
      if (!data.description) productDescEl.style.display = "none";

      productPriceEl.textContent = formatPrice(data.price);
      productPriceEl.classList.remove("skeleton");
      if (!data.price || data.price.type !== "fixed") productPriceEl.style.display = "none";

      btn.disabled = false;
      btn.textContent = "Payer maintenant";
    } catch (e) {
      showError("Erreur de chargement du produit : " + e.message);
    }
  }

  btn.addEventListener("click", async () => {
    errEl.style.display = "none";
    btn.disabled = true;
    const previousLabel = btn.textContent;
    btn.textContent = "Chargement...";

    try {
      const res = await fetch("/api/checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: emailInput.value || undefined }),
      });

      const raw = await res.text();
      let data;
      try {
        data = JSON.parse(raw);
      } catch {
        throw new Error("Réponse inattendue du serveur : " + raw.slice(0, 300));
      }

      if (!res.ok) throw new Error((data.error || "Erreur serveur inconnue (" + res.status + ")") + (data.detail ? " — " + data.detail : ""));
      if (!data.url) throw new Error("Aucune URL de checkout renvoyée par le serveur.");
      if (typeof PolarEmbedCheckout === "undefined") {
        throw new Error("Le script Polar (embed.global.js) ne s'est pas chargé.");
      }

      await PolarEmbedCheckout.create(data.url, { theme: "dark" });
    } catch (e) {
      showError(e.message || String(e));
    } finally {
      btn.disabled = false;
      btn.textContent = previousLabel;
    }
  });

  loadProduct();
</script>

</body>
</html>
